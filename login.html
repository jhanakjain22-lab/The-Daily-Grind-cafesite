<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - The Daily Grind</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="axios-config.js"></script>
  </head>
  <body>

    <!-- HEADER -->
    <header>
      <nav>
        <a href="index.html" class="logo">The Daily Grind</a>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="login.html" class="active">Login</a></li>
          <li><a href="register.html">Register</a></li>
        </ul>
      </nav>
    </header>

    <!-- AUTH FORM -->
    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-icon">☕</div>
        <h1>Welcome Back</h1>
        <p class="auth-subtitle">Sign in to your account</p>

        <div id="login-error" class="auth-error" style="display:none;"></div>

        <form id="login-form" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required />
          </div>
          <button type="submit" class="auth-btn">Sign In</button>
        </form>

        <p class="auth-switch">Don't have an account? <a href="register.html">Register here</a></p>
      </div>
    </div>

    <!-- FOOTER -->
    <footer>
      <div class="footer-bottom">
        <p>&copy; 2026 The Daily Grind. All rights reserved.</p>
      </div>
    </footer>

    <script src="auth.js"></script>
  </body>
</html>
