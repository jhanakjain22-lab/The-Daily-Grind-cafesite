<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Confirmed - The Daily Grind</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="axios-config.js"></script>
    <style>
      .order-wrapper {
        max-width: 600px;
        margin: 3rem auto;
        padding: 0 1.5rem;
      }
      .order-card {
        background: var(--white);
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(60, 36, 21, 0.1);
        padding: 2.5rem;
        text-align: center;
      }
      .order-icon {
        font-size: 4rem;
        margin-bottom: 1rem;
      }
      .order-card h1 {
        font-size: 2rem;
        color: var(--brown-dark);
        margin-bottom: 0.5rem;
      }
      .order-subtitle {
        color: var(--text-light);
        margin-bottom: 2rem;
      }
      .order-details {
        background: var(--cream);
        border-radius: 8px;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
        text-align: left;
      }
      .order-detail-row {
        display: flex;
        justify-content: space-between;
        padding: 0.5rem 0;
        border-bottom: 1px solid #f0e6d9;
      }
      .order-detail-row:last-child {
        border-bottom: none;
        font-weight: 600;
        font-size: 1.1rem;
        color: var(--brown-dark);
        padding-top: 0.75rem;
      }
      .order-detail-label {
        color: var(--text-light);
      }
      .order-detail-value {
        color: var(--brown-dark);
        font-weight: 500;
      }
      .order-status {
        display: inline-block;
        padding: 0.5rem 1rem;
        border-radius: 20px;
        font-weight: 600;
        font-size: 0.9rem;
        margin-bottom: 1.5rem;
      }
      .order-status.success {
        background: #e6f9e6;
        color: #2d7a2d;
      }
      .order-status.pending {
        background: #fff3cd;
        color: #856404;
      }
      .order-status.failed {
        background: #fee;
        color: #c33;
      }
      .order-actions {
        display: flex;
        gap: 1rem;
        justify-content: center;
        margin-top: 1.5rem;
      }
      .order-btn {
        padding: 0.75rem 1.5rem;
        border-radius: 8px;
        font-weight: 600;
        text-decoration: none;
        transition: transform 0.2s, box-shadow 0.2s;
      }
      .order-btn-primary {
        background: linear-gradient(135deg, var(--brown-medium), var(--brown-dark));
        color: var(--white);
        border: none;
        cursor: pointer;
      }
      .order-btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(60, 36, 21, 0.3);
      }
      .order-btn-secondary {
        background: var(--white);
        color: var(--brown-medium);
        border: 2px solid var(--brown-medium);
      }
      .order-btn-secondary:hover {
        background: var(--cream);
      }
    </style>
  </head>
  <body>

    <!-- HEADER -->
    <header>
      <nav>
        <a href="index.html" class="logo">The Daily Grind</a>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="#menu">Menu</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </header>

    <!-- ORDER CONFIRMATION -->
    <div class="order-wrapper">
      <div class="order-card">
        <div class="order-icon" id="order-icon">✓</div>
        <h1 id="order-title">Order Confirmed!</h1>
        <p class="order-subtitle" id="order-subtitle">Thank you for your order.</p>

        <div class="order-status success" id="order-status">Payment Successful</div>

        <div class="order-details" id="order-details">
          <div class="order-detail-row">
            <span class="order-detail-label">Order ID</span>
            <span class="order-detail-value" id="detail-order-id">--</span>
          </div>
          <div class="order-detail-row">
            <span class="order-detail-label">Payment ID</span>
            <span class="order-detail-value" id="detail-payment-id">--</span>
          </div>
          <div class="order-detail-row">
            <span class="order-detail-label">Payment Method</span>
            <span class="order-detail-value">Razorpay (Test Mode)</span>
          </div>
          <div class="order-detail-row">
            <span class="order-detail-label">Amount Paid</span>
            <span class="order-detail-value" id="detail-total">$0.00</span>
          </div>
        </div>

        <div class="order-actions">
          <a href="index.html" class="order-btn order-btn-primary">Back to Menu</a>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <footer>
      <div class="footer-bottom">
        <p>&copy; 2026 The Daily Grind. All rights reserved.</p>
      </div>
    </footer>

    <script src="auth.js"></script>
    <script>
      function renderOrder() {
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get('id') || 'N/A';
        const payment = params.get('payment');
        const total = params.get('total') || '0.00';
        const paymentId = params.get('paymentId') || 'N/A';

        document.getElementById('detail-order-id').textContent = orderId;
        document.getElementById('detail-payment-id').textContent = paymentId;
        document.getElementById('detail-total').textContent = `$${parseFloat(total).toFixed(2)}`;

        const statusEl = document.getElementById('order-status');
        const iconEl = document.getElementById('order-icon');
        const titleEl = document.getElementById('order-title');
        const subtitleEl = document.getElementById('order-subtitle');

        if (payment === 'success') {
          statusEl.textContent = 'Payment Successful';
          statusEl.className = 'order-status success';
          iconEl.textContent = '✓';
          titleEl.textContent = 'Order Confirmed!';
          subtitleEl.textContent = 'Thank you for your order. Your coffee is being prepared!';
        } else if (payment === 'failed') {
          statusEl.textContent = 'Payment Failed';
          statusEl.className = 'order-status failed';
          iconEl.textContent = '✗';
          titleEl.textContent = 'Payment Failed';
          subtitleEl.textContent = 'Something went wrong with your payment. Please try again.';
        } else {
          statusEl.textContent = 'Pending';
          statusEl.className = 'order-status pending';
          iconEl.textContent = '...';
          titleEl.textContent = 'Order Placed';
          subtitleEl.textContent = 'Your order is being processed.';
        }
      }

      renderOrder();
    </script>
    <script>updateNavAuth();</script>
  </body>
</html>
