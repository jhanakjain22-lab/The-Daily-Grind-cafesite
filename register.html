<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - The Daily Grind</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="axios-config.js"></script>
  </head>
  <body>

    <!-- HEADER -->
    <header>
      <nav>
        <a href="index.html" class="logo">The Daily Grind</a>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="login.html">Login</a></li>
          <li><a href="register.html" class="active">Register</a></li>
        </ul>
      </nav>
    </header>

    <!-- AUTH FORM -->
    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-icon">☕</div>
        <h1>Create Account</h1>
        <p class="auth-subtitle">Join The Daily Grind today</p>

        <div id="register-error" class="auth-error" style="display:none;"></div>
        <div id="register-success" class="auth-success" style="display:none;"></div>

        <form id="register-form" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="John Doe" required />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Min 6 characters" required minlength="6" />
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" placeholder="Repeat your password" required minlength="6" />
          </div>
          <button type="submit" class="auth-btn">Create Account</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="login.html">Sign in here</a></p>
      </div>
    </div>

    <!-- FOOTER -->
    <footer>
      <div class="footer-bottom">
        <p>&copy; 2026 The Daily Grind. All rights reserved.</p>
      </div>
    </footer>

    <script src="auth.js"></script>
  </body>
</html>
